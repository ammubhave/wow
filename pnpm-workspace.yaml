catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^1.5.1
  # Must match the exact vitest version vite-plus depends on.
  vitest: 5.1.0
  vite-plus: ^1.5.1
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  react: "^19.3.1"
  react-dom: "^19.3.1"
  react-aria-components: "^1.22.1"
  # Security fixes for transitive dependencies (Dependabot alerts, 2026-11-11). Excalidraw and its
  # mermaid import pin vulnerable versions; drop each line once they ship patched ones.
  nanoid@<3.3.18: ^3.3.18
  "nanoid@>=4.0.0 <5.1.16": ^5.1.16
  lodash-es@<4.18.0: ^4.18.1
  katex@<0.18.2: ^0.18.2
  # Via @heroui-pro/react.
  figlet@<1.11.3: ^1.11.3
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  "@heroui-pro/react": true
  # Downloads the posthog-cli binary used to upload source maps.
  "@posthog/cli": true
  esbuild: true
  heroui-pro: true
  sharp: true
  workerd: true
  # Install scripts we don't need: prebuilt binaries are shipped (@parcel/watcher, zowe keyring),
  # donation banner, test-only worker copy.
  "@parcel/watcher": false
  "@zowe/secrets-for-zowe-sdk": false
  core-js: false
  msw: false
